name: Efeméride diaria

on:
  schedule:
    # 06:30 UTC ≈ 07:30/08:30 hora de España (según horario de verano/invierno)
    - cron: "30 6 * * *"
  workflow_dispatch: {} # permite ejecutarlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  generar-efemeride:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generar la efeméride del día
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generar-efemeride.mjs

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/efemerides.json efemerides/
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Efeméride diaria $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
